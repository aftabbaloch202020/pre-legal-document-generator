version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: prelegal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: prelegal_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prelegal_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prelegal_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@db:5432/prelegal_db?schema=public"
      JWT_SECRET: "prelegal-production-jwt-token-key-2026-super-secure"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NODE_ENV: "production"

volumes:
  postgres_data:
    driver: local
